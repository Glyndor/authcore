services:
  app:
    image: localhost/authcore-probe:recipe
    user: "${PROBE_UID}:${PROBE_GID}"
    userns_mode: keep-id
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    restart: unless-stopped
    environment:
      AUTHCORE_KEYS_DIR: /run/authcore
    volumes:
      - authcore_keys:/run/authcore:ro
    healthcheck:
      test: ["CMD", "/probe", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3

volumes:
  authcore_keys:
    external: true
    name: ${KEYS_VOLUME}
