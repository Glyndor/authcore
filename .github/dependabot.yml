version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "develop"
    labels:
      - "type:deps"
    open-pull-requests-limit: 10
    # Patch and minor bumps of the library's own dependencies land together:
    # on 2026-09-19 four golang.org/x bumps arrived as four pull requests that
    # each ran the full CI for the same review. Majors stay out of the group,
    # one pull request each, because a major is the one worth reading alone.
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"

  # The examples are standalone Go modules with their own go.mod, so the root
  # entry above does not see them. Track them too — otherwise an example
  # dependency drifts and accumulates advisories unmonitored.
  #
  # Grouped, because there are nine of them and they move together. Since the
  # examples stopped using a `replace` and started requiring the published
  # version (#213), every release makes authcore itself a dependency that has
  # drifted in all nine at once: v1.11.6 produced ten separate pull requests
  # that all said the same thing. One group is one review.
  - package-ecosystem: "gomod"
    directories:
      - "/examples/*"
    schedule:
      interval: "daily"
    target-branch: "develop"
    labels:
      - "type:deps"
    open-pull-requests-limit: 10
    groups:
      examples:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "develop"
    labels:
      - "type:deps"
      - "type:ci"
    open-pull-requests-limit: 10
    # Two groups, not one, because they get opposite reviews. One release of
    # Glyndor/.github opened nine pull requests on 2026-09-19, one per
    # reusable, and a reusable bump usually changes nothing this repository
    # calls. An actions/* bump (checkout, setup-go) is the one worth reading
    # line by line. In a single group, closing the first as a no-op would
    # close the second with it.
    groups:
      glyndor-reusables:
        patterns:
          - "Glyndor/*"
      github-owned:
        patterns:
          - "actions/*"
    commit-message:
      prefix: "ci"
      include: "scope"
