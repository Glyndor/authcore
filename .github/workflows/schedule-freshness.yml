name: Schedule freshness

# The weekly audit, fuzz, containers recipe, and pin watch runs are the only
# guards here that can fail by silence: a cron that stops firing emits
# nothing, and no alert reads exactly like all clear. That is how this
# repository went four weeks without a security scan in July 2026, and how
# GO-2026-5856 ended up being found by hand instead of by the audit that
# exists for it.
#
# Asserting freshness from ordinary CI turns that absence into a red check on
# everyday work.

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Daily, 06:47 UTC: the watchdog has to wake up on its own, because the
    # question it asks — did the weekly crons fire? — does not change with the
    # tree and would otherwise only be asked when a pull request opens
    # (standards/ci, rule 6). A push to develop or main asked the same
    # question a minute after the pull request did, so it is gone.
    - cron: '47 6 * * *'

# A called workflow cannot elevate beyond what the caller grants, so the
# actions: read the freshness job needs to query run history has to be granted
# here too.
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: audit freshness
    uses: Glyndor/.github/.github/workflows/schedule-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      workflow: audit.yml
      max-age-days: 15 # weekly cron, so two periods of slack

  fuzz:
    name: fuzz freshness
    uses: Glyndor/.github/.github/workflows/schedule-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      workflow: fuzz.yml
      max-age-days: 15 # weekly cron, so two periods of slack

  containers:
    name: containers freshness
    uses: Glyndor/.github/.github/workflows/schedule-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      workflow: containers.yml
      max-age-days: 15 # weekly cron, so two periods of slack

  pin-watch:
    name: pin watch freshness
    uses: Glyndor/.github/.github/workflows/schedule-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      workflow: pin-watch.yml
      max-age-days: 15 # weekly cron, so two periods of slack

  # hostile.yml and unit-repeat.yml have a weekly cron too, but their
  # freshness jobs are deliberately not here yet. A schedule only fires from
  # the default branch, and with no successful scheduled run on record this
  # check fails, which would turn every
  # pull request red until the workflow has been promoted to main and fired
  # once. After that first green scheduled run, add:
  #
  #   hostile:
  #     name: hostile freshness
  #     uses: <same reusable and pin as above>
  #     with:
  #       workflow: hostile.yml
  #       max-age-days: 15 # weekly cron, so two periods of slack

  # dependabot-security-watch.yml deliberately has no freshness job here:
  # its push to develop produces a second liveness signal on every merge
  # (see that workflow's trigger rationale). Revisit if that trigger is removed.
  #
  # portability.yml needs a watcher too, once its first successful scheduled
  # run exists. Its first Friday cron after promotion to main is 2026-10-30;
  # adding the check before that evidence would make it fail on every PR.
  # Add the following job after confirming a successful schedule with gh run list:
  #
  #   portability:
  #     name: portability freshness
  #     uses: <same reusable and pin as above>
  #     with:
  #       workflow: portability.yml
  #       max-age-days: 15 # weekly cron, so two periods of slack
