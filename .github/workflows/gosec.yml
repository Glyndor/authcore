name: Gosec

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        # Run the tool directly instead of the securego/gosec action — the org
        # CI policy allows GitHub- and Glyndor-owned actions only. Pinned tag
        # keeps the workflow reproducible.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Run gosec
        # G104 (errcheck on logger Output) and G306 (public-key 0644) are
        # justified in code with //nolint:gosec; standalone gosec ignores those
        # pragmas so we exclude the rule IDs here. G115 mirrors the
        # .golangci.yml exclusion for UUID/time math.
        run: gosec -fmt sarif -out results.sarif -no-fail -exclude=G104,G115,G306 ./...

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
