name: Examples

# The examples are standalone Go modules (own go.mod), joined by examples/go.work
# so the workspace resolves authcore from the checkout instead of a per-example
# replace directive. The go-ci reusable builds the root module and never compiles
# them, so build, vet and run each example's tests here. Building an example is
# not exercising it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    timeout-minutes: 15  # measured locally 2026-09-18: build, vet and race tests of the slowest example took under 60s
    strategy:
      fail-fast: false
      matrix:
        example: [apikey, basic, containers, email, fiber, gin, jwt, oauth, password, username]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/${{ matrix.example }}/go.mod
          cache: true

      - name: Build, vet & test ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

  # Aggregation gate for the matrix above. needs: alone skips this job when
  # a matrix leg fails, and a skipped required check reports success to a
  # ruleset, so a broken example would merge green. With if: always() and an
  # explicit check of needs.build.result below, this job runs on every
  # outcome and surfaces the aggregate as a single stable check named
  # "Examples", which is the string GitHub emits for this check (the job's
  # name: in a non-reusable workflow), and the string a ruleset should
  # require. The per-leg "build & vet (<example>)" checks vary per matrix
  # leg and must not be required.
  examples:
    name: Examples
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    # One shell comparison. Five minutes is a ceiling, not a measurement:
    # tighten it after the first runs have been read.
    timeout-minutes: 5
    steps:
      - name: Verify matrix result
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          printf 'needs.build.result=%s\n' "$RESULT"
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi
