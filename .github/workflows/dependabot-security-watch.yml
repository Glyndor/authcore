name: Dependabot security watch

# Dependabot security updates ignore `target-branch` and open against `main`,
# where `main-guard` refuses any pull request whose source is not `develop`.
# The bump then sits open with one red check and nothing reports it; #112
# went that way and was closed unmerged. The response is to keep
# `target-branch: develop` and `main-guard` as they are, re-land each
# security bump by hand off `develop`, and make the stuck state loud. This workflow is the loud part: it lists the
# open pull requests into `main` and fails when Dependabot authored one whose
# head is not `develop`. The selection and the report live in
# `.github/scripts/dependabot_security_watch.py`; the `tests` job below runs
# the script's unit tests so a broken edit cannot merge without having been
# executed.
#
# Four triggers, each for a different reason:
#
# - `schedule`, daily: a stuck bump ages a day at a time, and the report has
#   to keep appearing whether or not anyone pushes. GitHub reads `schedule:`
#   from the default branch only, so this cron is inert until the workflow
#   is promoted to `main`; the push trigger covers the gap until then.
# - `push` to `develop`: the watcher proves itself alive every time work
#   lands, which stands in for a freshness watcher. A cron that stops firing
#   emits nothing, and "no alert" reads as "all clear"; a run that appears on
#   every merge into `develop` is the second fact that tells the two apart.
# - `pull_request`, path-filtered to this file and the two scripts: a
#   workflow whose path list omits itself never runs on the pull request
#   that changes it, so a broken edit merges without having been executed.
#   The `gh pr list` call is real on that event too, and read-only.
# - `workflow_dispatch`: rerun by hand after re-landing a bump, to confirm
#   the report went quiet.
#
# The check the runtime job emits is `dependabot security watch`, composed
# from the job id `dependabot-security-watch` and its `name:`. Written here
# so a ruleset can quote the exact string; it is advisory on purpose and not
# required anywhere. A required check that fails because a third party opened
# a pull request would block every unrelated merge on someone else's
# disclosure timing. The `tests` job emits a separate
# `dependabot security watch tests` check for the same reason: a stuck bump
# reported red is not the same signal as "the report itself no longer runs".

on:
  schedule:
    # Daily, 05:37 UTC. An off-peak minute, so the run does not queue behind
    # the on-the-hour crowd; GitHub schedules run hours late in any case.
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    paths:
      - ".github/workflows/dependabot-security-watch.yml"
      - ".github/scripts/dependabot_security_watch.py"
      - ".github/scripts/test_dependabot_security_watch.py"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-security-watch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-security-watch:
    name: dependabot security watch
    runs-on: ubuntu-latest
    # One checkout and one `gh pr list` call; the closest sibling
    # (`dependabot freshness` in the channel repositories) runs in under a
    # minute. Tighten after the first runs have been read, not before.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Dependabot pull requests stuck against main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # `--limit 100` is well above the open pull requests into main this
        # repository has ever held at once; the default of 30 would be too,
        # but the number is written down so the window is a decision.
        # `pipefail` makes a failed `gh` call fail the step; without it the
        # script would read an empty stream, exit 2, and the step would
        # still be red, but for a reason the log would not name.
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --base main --state open --limit 100 \
            --json number,title,author,headRefName,createdAt \
            | python3 .github/scripts/dependabot_security_watch.py

  tests:
    name: dependabot security watch tests
    runs-on: ubuntu-latest
    # 14 tests today; the local run finished in 0.524 s on 2026-09-27.
    # Five minutes leaves room for a hung runner, not for the test.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run dependabot security watch tests
        # Standard library only: `unittest` ships with Python and needs no
        # installed package, so a future Python bump cannot move the goal
        # posts by adding a dependency the workflow did not pin. Discovery
        # uses the same path the watch job runs against.
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v