name: Hostile

# The adversarial suite under tests/hostile already runs once inside the shared
# Go CI (`go test -race ./...`). This workflow runs it the way a flake or an
# ordering bug would show itself: twice per process and in shuffled order, so
# a test that only passes because another one ran first, or that leaves state
# behind, fails here instead of on someone's laptop.
#
# It is its own file rather than a job in ci.yml because it also carries a
# schedule. Time moves under these tests (JWKS caches, expiry, redirects), and
# an advisory or a toolchain bump can change an outcome without a commit, so the
# weekly run is the part that notices. schedule-freshness.yml watches
# per-workflow-file runs, which is the other reason to keep it separate.
#
# The cron sits off the hour and away from the other weekly runs (pin watch
# 05:17 Mon, audit 06:00 Mon, fuzz 07:00 Mon, containers 05:37 Tue).
#
# `-shuffle=on` only prints its seed under -v, which would bury the log, so the
# step picks the seed itself and echoes it. Reproducing a failure is then
# `go test -race -count=2 -shuffle=<seed> ./tests/hostile/...`.

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "7 5 * * 3"  # Every Wednesday at 05:07 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cost, measured on 2026-10-26: 123 s of job time per run. The suite is a
# property of the production code and of its own files, so a pull request
# into develop that changes only unrelated docs, CI, library unit tests or
# examples has nothing for it: `decide` skips it. Pull requests into main run it.
# Measured on 2026-10-27: the examples change in #612 spent 2.38 min here.
# Exclude only examples/ in addition to the library test patterns; tests/ stays
# eligible, including the hostile suite itself.
# The same suite also runs once inside the shared Go CI on every pull request,
# so this workflow adds only the repeat and the shuffle, which is what it is for.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tells the suite whether the hostile tests, or the code they attack, changed.
  # It always runs and always succeeds; on anything other than a pull request,
  # on a pull request into main, on a label change, and whenever it cannot tell,
  # it answers "run".
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # a checkout and one git diff; tighten it after the first runs
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          INCLUDE: '^tests/hostile/|\.go$|^go\.(mod|sum)$|^\.github/workflows/hostile\.yml$'
          EXCLUDE: '^(auth|internal|cmd)/.*_test\.go$|^[^/]+_test\.go$|^examples/'
        # Read the decision from the base before executing any pull-request code.
        # An older base without the script must run the full suite.
        # Release PRs also run if the base script predates the main policy.
        run: |
          script=scripts/ci-decide/decide.sh
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            printf 'run=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            script="$RUNNER_TEMP/ci-decide.sh"
            if ! git show "$BASE:scripts/ci-decide/decide.sh" >"$script"; then
              echo "base decision script unavailable; running the full suite" >&2
              printf 'run=true\n' >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          bash "$script" "$INCLUDE" "${EXCLUDE:-}"

  hostile:
    name: hostile suite
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The suite took about 13 s per pass on a developer machine on
    # 2026-10-25, so two passes plus the race build fit in well under a
    # minute; the bound is for a hung runner, not for the tests.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the hostile suite
        run: |
          seed="$(date +%s)"
          echo "shuffle seed: ${seed}"
          go test -race -count=2 -shuffle="${seed}" ./tests/hostile/...
