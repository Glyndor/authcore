name: API compatibility

# Compares the public API of a pull request (the module root and public auth/
# packages) against the tip of the branch it targets, with apidiff, and fails on an
# incompatible change unless the pull request carries the `breaking` label
# (standards/releases: a breaking change is labelled on the pull request).
# Additions never fail; they are annotated so a reviewer sees the surface grow.
#
# The comparison itself lives in scripts/api-compat/api-compat.sh, and
# scripts/api-compat/api-compat.test.sh tests the proposed script after the
# base comparator has judged the API. Candidate code must not alter that verdict.
#
# Triggers: the label events are in the list on purpose. Adding `breaking` to
# a failed pull request re-runs the check; without `labeled` the only way to
# turn it green would be to push another commit.
#
# The base is the pull request's base commit (github.event.pull_request.base.sha),
# which is the tip of develop for an ordinary pull request. A release pull
# request from develop to main always runs the comparison against main and
# reports the API difference remaining there: that is the point at which an
# unlabelled breaking change has to be noticed.
#
# apidiff is pinned by hand: golang.org/x/exp publishes no tags or releases,
# only pseudo-versions, so Dependabot cannot see the string below and
# pin-watch (which asks GitHub for the latest release) has nothing to ask. The
# install goes through the Go checksum database, and the step then compares the
# module hash recorded in the built binary with the one pinned here, so the two
# values must be bumped together.
#
# Measured on 2026-10-25 on a 16-core developer machine: installing apidiff
# from an empty module cache took 9 s, comparing ten packages took 8 s, and the
# script's own tests took 2 s. The runner has fewer cores; the bound below is
# for a hung runner, not for the work.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Cost, measured on 2026-10-26: 33 s of job time. The public API is the module
# root and public auth/ packages at any depth, so a pull request into develop
# that changes no non-test Go file there, and no module file, has nothing for it: `decide` skips the
# comparison. A label
# change always runs it, which is what re-evaluates a pull request. Every pull
# request into main runs it even when the path filter would skip it.
# The stable api compatibility check below also runs a shell-only aggregate,
# without checkout or installation, to reject failed decisions. Measure its
# runner time on the first Actions runs; its timeout is only a ceiling.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tells the comparison whether the public API, or the comparison itself, changed.
  # It always runs and always succeeds; on anything other than a pull request,
  # on a pull request into main, on a label change, and whenever it cannot tell,
  # it answers "run".
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # a checkout and one git diff; tighten it after the first runs
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Match public_packages in api-compat.sh: exclude directory components,
          # not similarly named public packages such as internalized or tests_helpers.
          INCLUDE: '^[^/]+\.go$|^auth/.*\.go$|^go\.(mod|sum)$|^scripts/api-compat/|^\.github/workflows/api-compat\.yml$'
          EXCLUDE: '_test\.go$|^auth/(.*/)?(internal|tests|examples|cmd)/'
        # Read the decision from the base before executing any pull-request code.
        # An older base without the script must run the full suite.
        # Release PRs also run if the base script predates the main policy.
        run: |
          script=scripts/ci-decide/decide.sh
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            printf 'run=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            script="$RUNNER_TEMP/ci-decide.sh"
            if ! git show "$BASE:scripts/ci-decide/decide.sh" >"$script"; then
              echo "base decision script unavailable; running the full suite" >&2
              printf 'run=true\n' >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          bash "$script" "$INCLUDE" "${EXCLUDE:-}"

  api-compat:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    # Keep the published check name on the aggregate below so a ruleset can
    # require it without accepting a skip caused by a failed decision.
    name: api compatibility run
    runs-on: ubuntu-latest
    # 33 s of job time measured on 2026-10-26; the bound is for a hung
    # runner, not for the comparison.
    timeout-minutes: 5
    env:
      APIDIFF_VERSION: v0.0.0-20260908205506-85c1c2202aba
      APIDIFF_MODULE_SUM: h1:Ck8QetSgk912qxWLMCKxd0in+aiyBQyDSMae6e/xmpU=
      # The labels travel as data through the environment and are parsed with
      # jq; they are never interpolated into a script.
      PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A dot directory is skipped by `go list ./...`, so the base checkout
      # does not appear as a package of the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .api-base
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install apidiff ${{ env.APIDIFF_VERSION }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION}"
          got="$(go version -m "$RUNNER_TEMP/bin/apidiff" | awk '$1 == "mod" && $2 == "golang.org/x/exp" { print $3 " " $4 }')"
          want="${APIDIFF_VERSION} ${APIDIFF_MODULE_SUM}"
          if [ "$got" != "$want" ]; then
            echo "apidiff module mismatch: built ${got:-nothing}, pinned ${want}" >&2
            exit 1
          fi

      - name: Compare the public API against the base
        run: |
          PR_LABELS="$(jq -r '.[]' <<<"$PR_LABELS_JSON")"
          export PR_LABELS
          # Fail if the base lacks the comparator; never substitute PR code.
          APIDIFF="$RUNNER_TEMP/bin/apidiff" bash .api-base/scripts/api-compat/api-compat.sh .api-base .

      # Run proposed script tests only after the trusted comparator has judged the API.
      - name: Test the comparison script
        if: ${{ !cancelled() }}
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD scripts/api-compat | tar -x -C "$tmp"
          PATH="$RUNNER_TEMP/bin:$PATH" bash "$tmp/scripts/api-compat/api-compat.test.sh"

  # A failed decision must turn the stable check red even if the comparison skips.
  # Only a successful comparison or an explicit, successful skip decision passes.
  api-compat-gate:
    name: api compatibility
    needs: [decide, api-compat]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2 # one shell comparison; measure runner time after adoption
    steps:
      - name: Verify decision and result
        env:
          DECIDE: ${{ needs.decide.result }}
          RUN: ${{ needs.decide.outputs.run }}
          RESULT: ${{ needs.api-compat.result }}
        run: |
          printf 'decide=%s run=%s result=%s\n' "$DECIDE" "$RUN" "$RESULT"
          [ "$DECIDE" = "success" ] || exit 1
          case "$RUN:$RESULT" in
            true:success|false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac
