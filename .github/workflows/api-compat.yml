name: API compatibility

# Compares the public API of a pull request (the module root and auth/*)
# against the tip of the branch it targets, with apidiff, and fails on an
# incompatible change unless the pull request carries the `breaking` label
# (standards/releases: a breaking change is labelled on the pull request).
# Additions never fail; they are annotated so a reviewer sees the surface grow.
#
# The comparison itself lives in scripts/api-compat/api-compat.sh, and
# scripts/api-compat/api-compat.test.sh runs first in this job, so a change to
# the script that stopped it failing would fail here before it judged anything.
#
# Triggers: the label events are in the list on purpose. Adding `breaking` to
# a failed pull request re-runs the check; without `labeled` the only way to
# turn it green would be to push another commit.
#
# The base is the pull request's base commit (github.event.pull_request.base.sha),
# which is the tip of develop for an ordinary pull request. A release pull
# request from develop to main is compared against main and so reports
# everything since the last release: that is the point at which an unlabelled
# breaking change has to be noticed.
#
# apidiff is pinned by hand: golang.org/x/exp publishes no tags or releases,
# only pseudo-versions, so Dependabot cannot see the string below and
# pin-watch (which asks GitHub for the latest release) has nothing to ask. The
# install goes through the Go checksum database, and the step then compares the
# module hash recorded in the built binary with the one pinned here, so the two
# values must be bumped together.
#
# Measured on 2026-10-25 on a 16-core developer machine: installing apidiff
# from an empty module cache took 9 s, comparing ten packages took 8 s, and the
# script's own tests took 2 s. The runner has fewer cores; the bound below is
# for a hung runner, not for the work.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: api-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-compat:
    # Not a required check yet: the name is chosen once so a ruleset can
    # require it later without orphaning anything.
    name: api compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APIDIFF_VERSION: v0.0.0-20260908205506-85c1c2202aba
      APIDIFF_MODULE_SUM: h1:Ck8QetSgk912qxWLMCKxd0in+aiyBQyDSMae6e/xmpU=
      # The labels travel as data through the environment and are parsed with
      # jq; they are never interpolated into a script.
      PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A dot directory is skipped by `go list ./...`, so the base checkout
      # does not appear as a package of the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .api-base
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install apidiff ${{ env.APIDIFF_VERSION }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION}"
          got="$(go version -m "$RUNNER_TEMP/bin/apidiff" | awk '$1 == "mod" && $2 == "golang.org/x/exp" { print $3 " " $4 }')"
          want="${APIDIFF_VERSION} ${APIDIFF_MODULE_SUM}"
          if [ "$got" != "$want" ]; then
            echo "apidiff module mismatch: built ${got:-nothing}, pinned ${want}" >&2
            exit 1
          fi

      - name: Test the comparison script
        run: PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/api-compat/api-compat.test.sh

      - name: Compare the public API against the base
        run: |
          PR_LABELS="$(jq -r '.[]' <<<"$PR_LABELS_JSON")"
          export PR_LABELS
          APIDIFF="$RUNNER_TEMP/bin/apidiff" bash scripts/api-compat/api-compat.sh .api-base .
