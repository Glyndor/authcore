name: Security audit

on:
  # The schedule is what catches an advisory published after a merge. The
  # pull_request trigger is what stops a merge outrunning the audit by a week:
  # auth/totp landed and shipped in v1.13.0 hours before the Monday cron found
  # its crypto/sha1 import, so the release was tagged before the audit had an
  # opinion. Both triggers are needed; neither replaces the other.
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

# Cost, measured on 2026-10-26: gosec 51 s and govulncheck 28 s of job time. On
# a pull request they look at Go source and module files, so a pull request that
# changes neither skips them; the schedule and manual runs always run.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tells the audit whether any Go file or module file changed.
  # It always runs and always succeeds; on anything other than a pull request,
  # on a label change, and whenever it cannot tell, it answers "run".
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # a checkout and one git diff; tighten it after the first runs
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          INCLUDE: '\.go$|^go\.(mod|sum)$|^\.github/workflows/audit\.yml$'
          EXCLUDE: ''
        # Read the decision from the base before executing any pull-request code.
        # An older base without the script must run the full suite.
        run: |
          script=scripts/ci-decide/decide.sh
          if [ "$EVENT" = "pull_request" ]; then
            script="$RUNNER_TEMP/ci-decide.sh"
            if ! git show "$BASE:scripts/ci-decide/decide.sh" >"$script"; then
              echo "base decision script unavailable; running the full suite" >&2
              printf 'run=true\n' >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          bash "$script" "$INCLUDE" "${EXCLUDE:-}"

  # A skipped call of a reusable workflow reports as "audit", not as the
  # "audit / gosec" and "audit / govulncheck" the ruleset waits for, so a pull
  # request that touches no Go code stayed blocked. These two report those names
  # when the audit is skipped.
  skipped-gosec:
    name: audit / gosec
    needs: decide
    if: needs.decide.outputs.run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "no Go or module file changed; gosec skipped"

  skipped-govulncheck:
    name: audit / govulncheck
    needs: decide
    if: needs.decide.outputs.run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "no Go or module file changed; govulncheck skipped"

  audit:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: Glyndor/.github/.github/workflows/go-audit.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      # G104 (errcheck on logger Output) and G306 (public-key 0644) are justified
      # in code with //nolint:gosec; standalone gosec ignores those pragmas.
      # G115 mirrors the .golangci.yml exclusion for UUID/time math.
      # G101 is a false positive on the OAuth provider preset URLs (a field named
      # *TokenURL* holding a public endpoint, not a credential).
      # G505 is auth/totp/internal/hotp importing crypto/sha1. RFC 6238 defines TOTP over
      # HMAC-SHA1 and every authenticator app implements that, so anything else
      # is a module nobody can pair with. SHA-1 collision attacks do not carry
      # to HMAC. The import is annotated in code too, but standalone gosec
      # ignores //nolint pragmas, which is why the exclusions above exist.
      # tests/meta/sha1_import_test.go asserts no second package picks up this exclusion.
      gosec-exclude: "G104,G115,G306,G101,G505"
