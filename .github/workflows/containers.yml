name: Containers

# Runs examples/deploy/containers/recipe.sh, which turns the central claims of
# docs/guides/containers.md into a check: keygen once, copy into a named volume, the
# guard that refuses an existing volume, three read-only keep-id replicas that
# must all load the same key, a down -v and up that must keep it, and an empty
# volume that RequireExistingKeys must refuse.
#
# Podman and podup change outside this repository, so a green history of pull
# requests says nothing about them. The weekly run is what notices when the
# runner image or a new podup breaks the recipe.
#
# Dependabot does not see PODUP_VERSION and PODUP_SHA256: bump both by hand
# from the release's SHA256SUMS. sha256sum -c fails the step on a mismatch
# before the binary runs.

# Triggers: pull requests, the weekly schedule and manual runs. A push to
# develop or main re-ran the recipe on a tree the pull request had just tested
# and nothing read it, so it is gone (standards/ci, rule 5). The weekly run is
# the one that notices podman, the runner image or podup moving under the
# recipe, which a green pull request history cannot.
#
# Cost, measured on 2026-10-26: 33 s of job time. The recipe looks at the
# container example and at the code it builds against, so a pull request into
# develop that touches only tests, unrelated docs or unrelated CI skips it:
# `decide` answers, and the required `containers recipe` check reports success
# without having run. Pull
# requests into main always run the recipe.

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, off the hour. GitHub reads schedules from the default branch,
    # so this fires only once the workflow is on main.
    - cron: '37 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tells the recipe whether the container example, or the code it builds against, changed.
  # It always runs and always succeeds; on anything other than a pull request,
  # on a pull request into main, on a label change, and whenever it cannot tell,
  # it answers "run".
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # a checkout and one git diff; tighten it after the first runs
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          INCLUDE: '^examples/deploy/|^docs/guides/containers\.md$|\.go$|^go\.(mod|sum)$|^\.github/workflows/containers\.yml$'
          EXCLUDE: '^(auth|internal|cmd|tests)/.*_test\.go$|^[^/]+_test\.go$'
        # Read the decision from the base before executing any pull-request code.
        # An older base without the script must run the full suite.
        # Release PRs also run if the base script predates the main policy.
        run: |
          script=scripts/ci-decide/decide.sh
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            printf 'run=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            script="$RUNNER_TEMP/ci-decide.sh"
            if ! git show "$BASE:scripts/ci-decide/decide.sh" >"$script"; then
              echo "base decision script unavailable; running the full suite" >&2
              printf 'run=true\n' >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          bash "$script" "$INCLUDE" "${EXCLUDE:-}"

  recipe:
    name: containers recipe run
    needs: decide
    if: needs.decide.outputs.run == 'true'
    # podup requires Podman 5.0 or later. ubuntu-24.04, which ubuntu-latest
    # still points to, ships Podman 4.9.3; ubuntu-26.04 ships 5.7.0, the
    # version docs/guides/containers.md was measured on (both read 2026-10-04).
    runs-on: ubuntu-26.04
    # 33 s of job time measured on 2026-10-26; the bound is for a hung
    # runner, not for the recipe.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download and verify podup ${{ env.PODUP_VERSION }}
        env:
          PODUP_VERSION: 5.14.0
          PODUP_SHA256: ed8619014778e4732b160f3ac3154fbeb57d1aaadefbd685d4e41ff233dfeff8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL -o "$RUNNER_TEMP/bin/podup" \
            "https://github.com/Glyndor/podup/releases/download/v${PODUP_VERSION}/podup-linux-x86_64"
          echo "${PODUP_SHA256}  $RUNNER_TEMP/bin/podup" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/podup"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # podup speaks the libpod API, and the runner image does not start the
      # rootless user socket (first run: "podman.sock: No such file or
      # directory"). podman --remote fails here if the socket is not answering.
      - name: Start the Podman API socket
        run: |
          systemctl --user enable --now podman.socket
          podman --remote version

      - name: Run the containers recipe
        run: bash examples/deploy/containers/recipe.sh

  # Keep the published name on an always-running gate. A failed decision is
  # not evidence that the work was irrelevant.
  recipe-gate:
    name: containers recipe
    needs: [decide, recipe]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2 # one shell comparison, well under a second of work
    steps:
      - name: Verify decision and result
        env:
          DECIDE: ${{ needs.decide.result }}
          RUN: ${{ needs.decide.outputs.run }}
          RESULT: ${{ needs.recipe.result }}
        run: |
          printf 'decide=%s run=%s result=%s\n' "$DECIDE" "$RUN" "$RESULT"
          [ "$DECIDE" = "success" ] || exit 1
          case "$RUN:$RESULT" in
            true:success|false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac
