name: Folder limit

# Run on every PR: counting the tree takes seconds, so no decide job is needed.
# Keep this advisory until promotion is explicitly approved; no ruleset change.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  folder-limit:
    name: folder limit
    runs-on: ubuntu-latest
    timeout-minutes: 3  # Measured locally 2026-10-28: gate 0.04 s, tests 0.90 s; allow checkout time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check direct file counts with the base gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Load the gate from the base so a PR cannot rewrite its own checker.
        # Only the first introducing PR, whose base has no script, uses the PR
        # copy. Distinguish absence from an unreadable commit: errors must fail.
        run: |
          set -euo pipefail
          base="$(git rev-parse --verify "${BASE}^{commit}")"
          script="$RUNNER_TEMP/folder-limit.sh"
          git ls-tree --name-only "$base" -- scripts/folder-limit/folder-limit.sh >"$RUNNER_TEMP/folder-limit-base-path"
          if [ -s "$RUNNER_TEMP/folder-limit-base-path" ]; then
            git show "$base:scripts/folder-limit/folder-limit.sh" >"$script"
          else
            echo "base has no folder-limit gate; using PR copy for its first introduction" >&2
            cp scripts/folder-limit/folder-limit.sh "$script"
          fi
          nice -n 15 bash "$script"

      - name: Test the proposed gate
        run: nice -n 15 bash scripts/folder-limit/folder-limit.test.sh
