name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: Glyndor/.github/.github/workflows/go-fuzz.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
    with:
      fuzztime: "60s"
      targets: >-
        [
          {"package":"./auth/email","func":"FuzzValidateAndNormalize"},
          {"package":"./auth/username","func":"FuzzValidateAndNormalize"},
          {"package":"./auth/jwt","func":"FuzzVerifyAccessToken"},
          {"package":"./auth/jwt","func":"FuzzIsUUIDv7"},
          {"package":"./auth/password","func":"FuzzValidatePolicy"},
          {"package":"./auth/password","func":"FuzzParsePHC"},
          {"package":"./auth/apikey","func":"FuzzParseID"},
          {"package":"./auth/oauth","func":"FuzzParseJWK"},
          {"package":"./auth/credential","func":"FuzzVerify"},
          {"package":"./auth/field","func":"FuzzDecrypt"},
          {"package":"./auth/field","func":"FuzzEncryptDecrypt"},
          {"package":"./auth/totp","func":"FuzzVerify"},
          {"package":"./auth/totp","func":"FuzzVerifyRecoveryCode"},
          {"package":"./internal/keymanager","func":"FuzzFromPEM"}
        ]
