name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: Glyndor/.github/.github/workflows/go-fuzz.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      fuzztime: "60s"
      targets: >-
        [
          {"package":"./auth/email","func":"FuzzValidateAndNormalize"},
          {"package":"./auth/username","func":"FuzzValidateAndNormalize"},
          {"package":"./auth/jwt/internal/verify","func":"FuzzVerifyAccessToken"},
          {"package":"./auth/jwt/internal/tokenid","func":"FuzzIsUUIDv7"},
          {"package":"./auth/password/internal/policy","func":"FuzzValidatePolicy"},
          {"package":"./auth/password/internal/phc","func":"FuzzParsePHC"},
          {"package":"./auth/apikey","func":"FuzzParseID"},
          {"package":"./auth/oauth/internal/jwks/jwk","func":"FuzzParseJWK"},
          {"package":"./auth/credential","func":"FuzzVerify"},
          {"package":"./auth/field","func":"FuzzDecrypt"},
          {"package":"./auth/field","func":"FuzzEncryptDecrypt"},
          {"package":"./auth/totp/internal/verifier","func":"FuzzVerify"},
          {"package":"./auth/totp/internal/recovery","func":"FuzzVerifyRecoveryCode"},
          {"package":"./internal/keymanager","func":"FuzzFromPEM"},
          {"package":"./internal/keymanager/pemcodec","func":"FuzzDecodePEMBlock"},
          {"package":"./internal/keymanager/pemcodec","func":"FuzzDecodeEd25519PEM"},
          {"package":"./internal/keymanager/metadata","func":"FuzzRead"},
          {"package":"./internal/keymanager/keyload","func":"FuzzLoadRefreshSecret"},
          {"package":"./internal/keymanager/keyload","func":"FuzzLoadEd25519"},
          {"package":"./internal/keymanager/recovery/match","func":"FuzzFindStaging"},
          {"package":"./internal/keymanager/recovery/leftovers","func":"FuzzReportStagingName"},
          {"package":"./auth/oauth/internal/idtoken","func":"FuzzVerify"},
          {"package":"./auth/oauth/internal/discovery","func":"FuzzFetch"},
          {"package":"./auth/oauth/internal/userinfo","func":"FuzzFetch"},
          {"package":"./auth/oauth/internal/exchange","func":"FuzzDo"},
          {"package":"./auth/oauth/internal/jwks/fetch","func":"FuzzGet"},
          {"package":"./auth/oauth/internal/redirect","func":"FuzzCheck"},
          {"package":"./auth/oauth/internal/urlcheck","func":"FuzzRequireHTTPS"},
          {"package":"./auth/oauth/internal/safetext","func":"FuzzClip"},
          {"package":"./auth/oauth/internal/apple","func":"FuzzClientSecret"},
          {"package":"./auth/jwt/internal/rotation","func":"FuzzRotate"},
          {"package":"./auth/totp/internal/otpauth","func":"FuzzURI"},
          {"package":"./auth/totp/internal/secret","func":"FuzzDecode"},
          {"package":"./auth/email","func":"FuzzAcceptedAddressIsSafe"},
          {"package":"./auth/password","func":"FuzzValidatePolicyNormalisation"},
          {"package":"./tests/hostile/jwt","func":"FuzzVerifyAccessTokenAgreesWithReference"},
          {"package":"./tests/hostile/password","func":"FuzzVerifyMatchesReferenceArgon2"},
          {"package":"./tests/hostile/password","func":"FuzzNormalisationEquivalence"}
        ]
