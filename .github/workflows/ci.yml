name: CI

# Triggers: pull requests only. A push to develop or main re-ran the suite on
# the tree the pull request had just tested and nothing read it, so it is gone
# (standards/ci, rule 5).
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tells the lint job whether any Go source, module file or lint config
  # changed (standards/ci, "A check costs what it learns").
  # It always runs and always succeeds; on anything other than a pull request,
  # on a label change, and whenever it cannot tell, it answers "run".
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # a checkout and one git diff; tighten it after the first runs
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the decision script
        run: bash scripts/ci-decide/decide.test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          INCLUDE: '\.go$|^go\.(mod|sum)$|^\.golangci\.yml$|^\.github/workflows/ci\.yml$'
          EXCLUDE: ''
        run: bash scripts/ci-decide/decide.sh "$INCLUDE" "$EXCLUDE"

  go:
    uses: Glyndor/.github/.github/workflows/go-ci.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      coverage-threshold: 90
      # Every package clears this today, which is exactly when a floor is
      # cheapest to adopt. The aggregate alone let auth/oauth sit at 87.7% and
      # internal/keymanager at 85.7% — the two with the most attack surface —
      # while a fully covered clock helper paid for them.
      per-package-coverage-threshold: 90

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0

  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      max-age-days: 15

  # scripts/release-notes/release-notes.sh only runs when a tag is pushed, so a defect in it
  # would first show up in a release. Its test runs here instead.
  release-notes:
    name: Release notes script
    runs-on: ubuntu-latest
    # The suite took 0.24 s locally on 2026-09-25; the bound is for a hung
    # runner, not for the test.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/release-notes/release-notes.test.sh

  # The shared go-ci reusable runs gofmt, vet and tests but no lint, which
  # is why this job lives here. Pinning the tarball by sha256 is the gate; a
  # checksum mismatch fails the step before the binary runs.
  lint:
    name: golangci-lint
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The analysis took 2.4 s locally on 2026-09-27; five minutes also covers
    # the download. Tighten it after the first runs have been read.
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GOLANGCI_LINT_VERSION: 2.15.0
      GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download and verify golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: |
            tmp="$(mktemp -d)"
            curl -sSL -o "$tmp/golangci-lint.tar.gz" \
              "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
            echo "${GOLANGCI_LINT_SHA256}  $tmp/golangci-lint.tar.gz" | sha256sum -c -
            tar -xzf "$tmp/golangci-lint.tar.gz" -C "$RUNNER_TEMP"
      - name: Run golangci-lint
        run: >-
          "$RUNNER_TEMP/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          run ./...
